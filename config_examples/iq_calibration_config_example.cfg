# -*- coding: utf-8 -*-
# Example configuration for IQ Mixer Calibration system.
#
# This configuration demonstrates how to set up the complete IQ calibration
# system including:
# - Rohde & Schwarz RTO6 oscilloscope for spectrum measurements
# - Windfreak + Red Pitaya microwave source with IQ mixing
# - IQ calibration logic for automated calibration
#
# The calibration system optimizes:
# - DC offsets (I, Q) to minimize LO leakage
# - IQ imbalance (g, phi) to minimize image power
#
# Copy and adapt this configuration to your specific hardware setup.

global:
    # Startup modules - calibration is typically run from command line or logic
    # No GUI module for calibration yet (future enhancement)
    startup_modules: []

    # Data directory for calibration results
    default_data_dir: 'C:/Data/IQ_Calibration/'

    # Optional: dark theme
    stylesheet: 'qdark.qss'

hardware:
    # ==========================================================================
    # Spectrum Analyzer / Oscilloscope (R&S RTO6)
    # ==========================================================================
    # The RTO6 provides FFT-based spectrum measurements for monitoring
    # LO leakage and image rejection during calibration.

    rto6_spectrum:
        module.Class: 'oscilloscope.rohde_schwarz_rto6.RhodeSchwarzRTO6'
        options:
            # VISA address of the RTO6 oscilloscope
            visa_address: 'TCPIP0::10.203.129.15::inst0::INSTR'

            # Timeout for VISA operations (ms)
            timeout_ms: 5000

            # Input channel for FFT measurement (1-4)
            input_channel: 1

            # Input coupling: 'DC' or 'AC'
            input_coupling: 'DC'

            # Time scale per division (seconds)
            # Adjust based on IF frequency for optimal FFT resolution
            time_scale: 5e-9

    # ==========================================================================
    # Microwave Source (Windfreak + Red Pitaya)
    # ==========================================================================
    # Combined microwave source using:
    # - Windfreak SynthNV Pro as LO source
    # - Red Pitaya as IF source with IQ modulation
    # - IQ Mixer for upconversion
    #
    # Output frequency depends on sideband selection:
    # - 'upper' (USB, default): RF = LO + IF
    # - 'lower' (LSB):         RF = LO - IF

    mw_source_rp_windfreak:
        module.Class: 'microwave.mw_source_windfreak_synthnvpro_redpitaya.MicrowaveRedPitayaWindfreak'
        options:
            # Windfreak serial port
            windfreak_serial_port: 'COM3'
            windfreak_comm_timeout: 10  # seconds

            # Red Pitaya connection
            redpitaya_hostname: '10.203.129.28'
            redpitaya_port: 2222

            # PyRPL config name for shared instance
            # This name is used for sharing the connection with other modules
            redpitaya_config_name: 'iq_calibration_shared'

            # IF frequencies available (Hz)
            # Typical setup uses 3 frequencies for triple-ODMR
            if_frequencies:
                - 19.422e6
                - 21.580e6
                - 23.738e6

            # Which IF frequency to use for calculations (index into if_frequencies)
            if_frequency_index: 1  # Use 21.580 MHz

            # Fixed LO power for the IQ mixer (dBm)
            lo_power: 13

            # Sideband selection for IQ mixing
            # - 'upper' (USB, default): keep f_LO + f_IF, suppress f_LO - f_IF
            # - 'lower' (LSB):         keep f_LO - f_IF, suppress f_LO + f_IF
            sideband: 'upper'

            # Calibration files for each IF frequency
            # These will be created by the calibration process
            # After calibration, update these paths to point to your results
            calibration_files:
                19.422e6: 'C:/calibration_results/IF_19.422MHz/calibration_redpitaya_all_results_IF_19.422MHz.csv'
                21.580e6: 'C:/calibration_results/IF_21.580MHz/calibration_redpitaya_all_results_IF_21.580MHz.csv'
                23.738e6: 'C:/calibration_results/IF_23.738MHz/calibration_redpitaya_all_results_IF_23.738MHz.csv'

            # FM modulation settings (used for ODMR with lock-in detection)
            enable_fm: False
            fm_deviation_khz: 100.0
            fm_modulation_frequency: 5000.0

            # IQ phase offset for demodulation (degrees)
            # Adjust to maximize 1f signal on ODMR slope
            iq0_phase_offset: 0.0

            # Multi-frequency mode: 'single', 'dual', or 'triple'
            multi_frequency_mode: 'single'
            multi_frequency_amplitudes: [0.33, 0.34, 0.33]

logic:
    # ==========================================================================
    # IQ Calibration Logic
    # ==========================================================================
    # Orchestrates the automated IQ mixer calibration process.
    # Uses Nelder-Mead optimization to minimize LO leakage and image power.

    iq_calibration_logic:
        module.Class: 'iq_calibration_logic.IQCalibrationLogic'
        options:
            # Default IF frequency for calibration (Hz)
            if_frequency_hz: 21.58e6

            # Sideband to keep during calibration (must match the microwave hardware sideband)
            sideband: 'upper'

            # Output directory for calibration results
            # Subdirectories are created with timestamp and IF frequency
            calibration_output_dir: 'C:/calibration_results'

            # Optimization settings
            # Number of iterations for each calibration point
            # More iterations = better results but slower
            optimization_iterations: 2

            # Nelder-Mead tolerances
            xatol: 1e-4   # Tolerance on DC offset / IQ parameter changes
            fatol: 3.0    # Tolerance on power change (dB)
            maxiter: 50   # Maximum iterations per optimization

            # Robustness / performance
            warm_start: true            # warm-start each grid point from previous point
            dc_simplex_step: 0.05       # initial simplex step for (I_offset, Q_offset)
            iq_g_simplex_step: 0.02     # initial simplex step for g
            iq_phi_simplex_step: 0.05   # initial simplex step for phi (radians)
            point_retry_count: 3        # retries per (LO, amp) point on transient errors
            point_retry_delay_s: 5.0    # wait time between retries

            # Windfreak LO power is controlled by the microwave hardware module option `lo_power`.
        connect:
            spectrum_analyzer: 'rto6_spectrum'
            microwave: 'mw_source_rp_windfreak'

# gui:
    # ==========================================================================
    # IQ Calibration GUI (Future Enhancement)
    # ==========================================================================
    # A GUI for the calibration process would be a future enhancement.
    # For now, calibration is run programmatically via the logic module.
    #
    # iq_calibration_gui:
    #     module.Class: 'iq_calibration.iq_calibration_gui.IQCalibrationGui'
    #     connect:
    #         calibration_logic: 'iq_calibration_logic'

# ==============================================================================
# Usage Instructions
# ==============================================================================
#
# 1. Hardware Setup:
#    - Connect Red Pitaya to network and verify IP address
#    - Connect Windfreak SynthNV Pro via USB (note COM port)
#    - Connect RTO6 oscilloscope to network
#    - Physical connections:
#      * Red Pitaya Out1 → IQ Mixer I input
#      * Red Pitaya Out2 → IQ Mixer Q input
#      * Windfreak RF Out → IQ Mixer LO input
#      * IQ Mixer RF Out → RTO6 Ch1 input
#
# 2. Update Configuration:
#    - Set correct IP addresses for Red Pitaya and RTO6
#    - Set correct COM port for Windfreak
#    - Adjust calibration_output_dir to your preferred location
#
# 3. Running Calibration:
#    a. Start Qudi with this config:
#       qudi -c iq_calibration_config_example.cfg
#
#    b. In the IPython console:
#       # Get reference to calibration logic
#       # Note: qudi-core's ModuleManager has no `get_module()` method.
#       qudi.module_manager.activate_module('iq_calibration_logic')  # if not autostarted
#       cal = qudi.module_manager.get('iq_calibration_logic').instance
#       # If the module is already active (e.g. via global.startup_modules), you can also use:
#       # cal = iq_calibration_logic
#
#       # Define calibration grid
#       lo_freqs = cal.get_default_lo_frequencies(
#           center_ghz=2.87,  # Center around NV resonance
#           span_ghz=0.3,     # ±150 MHz span
#           num_points=61     # 5 MHz spacing
#       )
#
#       if_amps = cal.get_default_if_amplitudes(
#           min_amp=0.01,
#           max_amp=0.3,
#           num_points=10
#       )
#
#       # Run calibration for one IF frequency
#       output_file = cal.run_full_calibration(
#           lo_frequencies_ghz=lo_freqs,
#           if_amplitudes=if_amps,
#           if_frequency_hz=21.58e6
#       )
#
#       print(f"Calibration saved to: {output_file}")
#
#    c. Repeat for each IF frequency (19.422e6, 21.580e6, 23.738e6)
#
# 4. Using Calibration Results:
#    After calibration, update the calibration_files paths in this config
#    to point to your new calibration results. The microwave module will
#    automatically load and apply the calibration when activated.
#
# 5. Verification:
#    - Expected LO leakage: < -50 dBm (well suppressed)
#    - Expected image power: < -40 dBm (good rejection)
#    - Check SFDR (Spurious-Free Dynamic Range): > 30 dB typical
#
# 6. Troubleshooting:
#    - No signal on RTO6: Check physical connections and IF amplitude
#    - Optimization doesn't converge: Increase maxiter or adjust tolerances
#    - Poor LO suppression: DC offsets may be out of range, check ifsynth limits
#    - Poor image rejection: Phase imbalance may need wider search range
#    - Calibration takes too long: Reduce num_points or optimization_iterations
#
# 7. Advanced:
#    - Single point calibration:
#      result = cal.calibrate_single_point(lo_freq_ghz=2.87, if_amplitude=0.1)
#
#    - Abort running calibration:
#      cal.abort_calibration()
#
#    - Check interpolation bounds:
#      in_bounds, msg = cal.check_interpolation_bounds(
#          filepath='path/to/calibration.csv',
#          lo_ghz=2.90,
#          amplitude=0.15
#      )
#
# ==============================================================================
