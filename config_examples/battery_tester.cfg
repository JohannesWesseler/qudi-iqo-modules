# Read-only commissioning configuration for the Battery Dynamics HRT tester.
#
# Install the native live-data dependency into the Qudi environment first:
#   C:\Users\aj92uwef\PycharmProjects\qudi-core\venv\Scripts\python.exe -m pip install -e "C:\Users\aj92uwef\PycharmProjects\qudi-core\qudi-iqo-modules[battery-tester]"
#
# Playwright is an explicit discovery/UI fallback only; install the
# "battery-tester-playwright" extra if that fallback is required.
#
# This implementation does not yet expose task submission or start/stop controls.

global:
    startup_modules: []

hardware:
    hrt_battery_tester:
        module.Class: 'battery_tester.hrt_battery_tester.HrtBatteryTester'
        options:
            base_url: 'http://10.1.24.116:1841/'
            api_url: 'http://10.1.24.116:8000/'
            live_transport: 'socketio'
            socketio_url: 'http://10.1.24.116:3000/'
            socketio_path: 'socket.io'
            max_live_age_s: 5
            # The following browser options are only used when live_transport is 'playwright'.
            browser_channel: 'chrome'
            headless: true
            request_timeout_s: 10
            navigation_timeout_s: 30
            command_timeout_s: 10
            allowed_channels: [13, 14, 15, 16]
            require_live_data: true
            reconnect_attempts: 2
            reconnect_backoff_s: 0.5
            reconnect_cooldown_s: 10
            capture_diagnostics_on_error: true
            max_diagnostic_sets: 10

logic:
    battery_tester_logic:
        module.Class: 'battery_tester_logic.BatteryTesterLogic'
        options:
            poll_interval_s: 1.0
            require_temperature_sensor: true
            auto_start_monitoring: false
            monitor_channel_ids: [13, 14, 15, 16]
            monitor_flush_rows: 100
            monitor_flush_interval_s: 5
            monitor_max_buffer_rows: 10000
            monitor_save_thumbnail: true
        connect:
            battery_tester: hrt_battery_tester
