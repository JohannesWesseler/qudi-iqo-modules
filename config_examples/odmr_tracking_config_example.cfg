# -*- coding: utf-8 -*-
"""
Example configuration for ODMR Frequency Tracking system.

This configuration demonstrates how to set up the complete ODMR tracking
system including:
- Red Pitaya ODMR lock hardware
- Error signal streaming
- ODMR frequency tracking logic
- ODMR tracking GUI

Copy and adapt this configuration to your specific hardware setup.
"""

global:
    # Startup modules (load GUI on startup)
    startup_modules: ['odmr_tracking_gui']

    # Data directory for measurements
    default_data_dir: 'C:/Data/ODMR_Tracking/'

    # Optional: dark theme
    stylesheet: 'qdark.qss'

    # Optional: enable remote access
    # remote_modules_server:
    #     address: 'localhost'
    #     port: 12345

hardware:
    # ==========================================================================
    # Red Pitaya ODMR Lock (NEW - required for tracking)
    # ==========================================================================
    redpitaya_odmr_lock:
        module.Class: 'redpitaya.redpitaya_odmr_lock.RedPitayaOdmrLockHardware'
        options:
            # PyRPL config name for shared instance (not a file path!)
            redpitaya_config_name: 'rpy_shared_config'

            # Red Pitaya hostname/IP address
            redpitaya_hostname: '10.203.129.28'  # Replace with your Red Pitaya IP

            # Optional single-resonance Smith predictor profile
            lock_in_filter_resonance_1: '2kHz_linear'
            tracking_algorithm: 'smith_linear'
            smith_gain_multiplier: 4.0
            smith_delay_samples: 64

    # ==========================================================================
    # Red Pitaya Error Signal Streaming (NEW - required for tracking)
    # ==========================================================================
    redpitaya_stream:
        module.Class: 'redpitaya.redpitaya_data_instream.RedPitayaDataInStream'
        options:
            # Same PyRPL config as odmr_lock (shared instance - CRITICAL!)
            redpitaya_config_name: 'rpy_shared_config'
            redpitaya_hostname: '10.203.129.28'  # Must match odmr_lock

            # Buffer and calibration
            channel_buffer_size: 100000
            calibration_factor: 1.0
            signal_scale: 1.0

            # Input to stream: 'demod' for error signal
            # (Future: 'ftw' for frequency tracking)
            input: 'demod'

            # Sample rate: ~30.5 kHz (125 MHz / 4096)
            # Buffer size: 4096 samples (ring buffer)

    # ==========================================================================
    # Example: Other hardware modules (adapt to your setup)
    # ==========================================================================

    # Microwave source (required for ODMR)
    # microwave_source:
    #     module.Class: 'microwave.mw_source_smiq.MicrowaveSMIQ'
    #     options:
    #         visa_address: 'GPIB0::28::INSTR'
    #         comm_timeout: 10

    # Red Pitaya IF source (for frequency modulation)
    # redpitaya_if_source:
    #     module.Class: 'microwave.redpitaya.redpitaya_if_source.RedPitayaIFSource'
    #     options:
    #         config_file: 'C:/pyrpl_user_dir/redpitaya_config.yml'
    #         device_name: 'rp-f0a235'

    # NI DAQ for counting (photon detection)
    # ni_counting:
    #     module.Class: 'ni_x_series.ni_x_series_counter.NIXSeriesCounter'
    #     options:
    #         device_name: 'Dev1'
    #         counter_channels: ['Ctr0', 'Ctr1']
    #         sources: ['/Dev1/PFI8', '/Dev1/PFI9']

logic:
    # ==========================================================================
    # ODMR Logic (existing - required for scanning)
    # ==========================================================================
    # odmr_logic:
    #     module.Class: 'odmr_logic.OdmrLogic'
    #     options:
    #         scan_frequency_step: 1e6  # 1 MHz
    #     connect:
    #         microwave: 'microwave_source'
    #         counter: 'ni_counting'

    # ==========================================================================
    # Time Series Reader Logic (handles streaming - NEW ARCHITECTURE)
    # ==========================================================================
    # This module provides thread-safe, buffered data streaming with proper
    # Qt signal integration. Used by the tracking logic instead of direct
    # hardware access for better thread safety and GUI responsiveness.

    time_series_reader_logic:
        module.Class: 'time_series_reader_logic.TimeSeriesReaderLogic'
        options:
            # Maximum GUI update rate (Hz)
            max_frame_rate: 20

            # Internal buffer size (samples per channel)
            channel_buffer_size: 100000
        connect:
            # Connect to Red Pitaya streaming hardware
            streamer: 'redpitaya_stream'

    # ==========================================================================
    # ODMR Frequency Tracking Logic (REFACTORED)
    # ==========================================================================
    # Now delegates streaming to TimeSeriesReaderLogic for thread-safe
    # operation, following the same pattern as SensitivitySweepLogic.

    odmr_frequency_tracking_logic:
        module.Class: 'odmr_frequency_tracking_logic.OdmrFrequencyTrackingLogic'
        options:
            # Default lock bandwidth (Hz)
            default_lock_bandwidth: 300

            # Status polling interval (seconds) - for lock status only
            # Data streaming is handled by TimeSeriesReaderLogic signals
            status_poll_interval: 0.5
        connect:
            # Connect to ODMR logic for scan data (inherited from OdmrLogic)
            microwave: 'microwave_source'
            data_scanner: 'data_scanner'

            # Connect to Red Pitaya ODMR lock hardware
            odmr_lock_hw: 'redpitaya_odmr_lock'

            # Connect to TimeSeriesReaderLogic (NEW - replaces direct error_streamer)
            time_series_logic: 'time_series_reader_logic'

gui:
    # ==========================================================================
    # ODMR Tracking GUI (NEW)
    # ==========================================================================
    odmr_tracking_gui:
        module.Class: 'odmr_tracking.odmr_tracking_gui.OdmrTrackingGui'
        options:
            # Optional: enable antialiasing for smoother plots
            use_antialias: True
        connect:
            # Connect to ODMR frequency tracking logic
            tracking_logic: 'odmr_frequency_tracking_logic'

    # ==========================================================================
    # Optional: Standard ODMR GUI (for comparison/testing)
    # ==========================================================================
    # odmr_gui:
    #     module.Class: 'odmr.odmrgui.OdmrGui'
    #     connect:
    #         odmr_logic: 'odmr_logic'

# ==============================================================================
# Usage Instructions
# ==============================================================================
#
# 1. Setup:
#    - Install PyRPL: pip install pyrpl
#    - Connect Red Pitaya to network
#    - Update redpitaya_hostname with your Red Pitaya IP address
#    - Configure PyRPL IQ demodulator for ODMR error signal
#    - Set up ODMR scanning hardware (MW source, data scanner, etc.)
#
# 2. Architecture Notes (2024 Refactor):
#    The tracking logic now uses TimeSeriesReaderLogic for data streaming
#    instead of direct hardware access. This provides:
#    - Thread-safe buffered data acquisition
#    - Proper Qt signal integration (no GUI blocking)
#    - Consistent pattern with SensitivitySweepLogic
#    - Better separation of concerns
#
#    Signal flow:
#    RedPitayaDataInStream → TimeSeriesReaderLogic → OdmrFrequencyTrackingLogic → GUI
#
# 3. ODMR Tracking Workflow:
#    a. Start Qudi with this config: qudi -c odmr_tracking_config_example.cfg
#    b. ODMR Tracking GUI opens automatically
#    c. Perform ODMR scan (inherited from OdmrLogic)
#    d. In Tracking GUI:
#       - Drag fit region on ODMR plot or enter frequency range
#       - Click "Fit" to extract error signal slope
#       - Select lock mode (Integral or PI)
#       - Set bandwidth (typical: 300 Hz)
#       - Set damping (PI mode only, typical: 0.7)
#       - Click "Configure" to program hardware
#       - Click "Enable Lock" to start tracking
#    e. Monitor:
#       - Error signal time series (should stay near zero when locked)
#       - Lock status (Locked: ON, Saturated: NO)
#       - Correction frequency (tracks resonance shifts)
#    f. Click "Clear" to reset integrator if saturated
#    g. Click "Disable Lock" to stop tracking
#
# 4. Stream Mode Switching:
#    The tracking logic supports two stream modes:
#    - 'error': Demodulated error signal (LSB) - default
#    - 'correction': FTW frequency correction (Hz)
#
#    To switch modes, streaming must be stopped first:
#    logic.stop_error_stream()
#    logic.set_stream_mode('correction')
#    logic.start_error_stream()
#
# 5. Lock Tuning:
#    - Integral mode: Simple, stable, no overshoot
#      - Start with BW = 300 Hz
#      - Increase for faster response (max ~1 kHz)
#      - Decrease if oscillations observed
#
#    - PI mode: Faster response, requires tuning
#      - Start with BW = 300 Hz, ζ = 0.7 (critical damping)
#      - ζ < 0.7: faster but may overshoot
#      - ζ > 0.7: slower but more stable
#
# 6. Troubleshooting:
#    - Lock won't enable: Check PyRPL connection and IQ demodulator
#    - Lock won't acquire: Verify error signal slope sign and magnitude
#    - Lock saturates: Fit range may be wrong, or resonance drifted too far
#    - No error stream: Check TimeSeriesReaderLogic is connected and streaming
#    - GUI freezes: Ensure TimeSeriesReaderLogic is used (not direct hardware)
#
# 7. Advanced:
#    - FTW streaming for resonance tracking display (set stream_mode='correction')
#    - See: .agents/odmr_tracking_refactor_plan.md for architecture details
#
# ==============================================================================
