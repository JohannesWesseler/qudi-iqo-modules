# Safe development configuration for battery-test orchestration without physical hardware.

global:
    startup_modules: []

hardware:
    battery_tester_dummy:
        module.Class: 'dummy.battery_tester_dummy.BatteryTesterDummy'
        options:
            channel_ids: [1, 2, 3, 4]
            initial_voltage_v: 3.7
            temperature_c: 25.0
            start_delay_s: 0.25
            experiment_duration_s: 10.0

logic:
    battery_tester_logic:
        module.Class: 'battery_tester_logic.BatteryTesterLogic'
        options:
            poll_interval_s: 0.25
            require_temperature_sensor: true
            auto_start_monitoring: false
            monitor_channel_ids: [1, 2, 3, 4]
            monitor_flush_rows: 100
            monitor_flush_interval_s: 5
            monitor_max_buffer_rows: 10000
            monitor_save_thumbnail: true
        connect:
            battery_tester: battery_tester_dummy
