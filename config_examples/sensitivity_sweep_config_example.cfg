# Example configuration for ODMR-based magnetic field sensitivity measurements
# with automated parameter sweeps
#
# This configuration demonstrates how to set up the sensitivity sweep module
# for systematic exploration of microwave power, FM modulation frequency,
# and FM deviation parameters.
#
# Hardware requirements:
# - Red Pitaya with pyrpl for lock-in demodulation and streaming
# - Microwave source (e.g., Windfreak + Red Pitaya combination)
# - ODMR setup with NV centers

global:
    # Modules to load on startup
    startup_modules: [sensitivity_sweep_gui]

    # Default data directory
    default_data_dir: 'C:\Data\SensitivityMeasurements'

    # Remote modules server (optional - not needed for local operation)
    # remote_modules_server:
    #     address: 'localhost'
    #     port: 12345

    # Force remote calls by value (if using remote access)
    # force_remote_calls_by_value: True

    # Namespace server for Jupyter access
    namespace_server_port: 18861

    # Qt stylesheet
    stylesheet: 'qdark.qss'

# ============================================================================
# Hardware Modules
# ============================================================================

hardware:
    # Red Pitaya data instream for lock-in demodulation and time series
    redpitaya_stream:
        module.Class: 'redpitaya.redpitaya_data_instream.RedPitayaDataInStream'
        options:
            redpitaya_hostname: '192.168.1.100'  # Adjust to your Red Pitaya IP
            redpitaya_config_name: 'rpy_shared_config'
            channel_buffer_size: 100000  # Software buffer size (samples)
            calibration_factor: 1.0
            signal_scale: 1.0
            stream_input: 'demod'  # 'demod' for error signal, 'ftw_corr' for frequency correction

    # Microwave source (Red Pitaya + Windfreak combination)
    microwave_source:
        module.Class: 'microwave.mw_source_redpitaya_windfreak.MicrowaveRedPitayaWindfreak'
        options:
            redpitaya_hostname: '192.168.1.100'
            redpitaya_config_name: 'rpy_shared_config'
            windfreak_serial_port: 'COM3'  # Adjust to your Windfreak port
            windfreak_model: 'SynthHDv2'
            frequency_min: 100e6  # 100 MHz
            frequency_max: 6.4e9  # 6.4 GHz
            power_min: -50  # dBm
            power_max: 20   # dBm

    # ODMR scanner (data acquisition hardware)
    odmr_scanner:
        module.Class: 'data_scanner.DataScannerDummy'  # Replace with your actual scanner
        options:
            sample_timing: 'constant'
            data_type: 'float64'

# ============================================================================
# Logic Modules
# ============================================================================

logic:
    # Time series reader for streaming data acquisition
    time_series_reader_logic:
        module.Class: 'time_series_reader_logic.TimeSeriesReaderLogic'
        options:
            max_frame_rate: 20  # Hz - GUI update rate
            channel_buffer_size: 1000000  # samples - large buffer for long recordings
            max_raw_data_bytes: 1e9  # 1 GB limit for recordings
        connectors:
            streamer: redpitaya_stream

    # ODMR logic for resonance scanning and CW control
    odmr_logic:
        module.Class: 'odmr_logic.OdmrLogic'
        options:
            scan_axis_start: 2.70e9  # Hz
            scan_axis_stop: 3.00e9   # Hz
            scan_axis_step: 1e6      # Hz
            scan_sample_rate: 1000   # Hz
        connectors:
            microwave: microwave_source
            data_scanner: odmr_scanner

    # Sensitivity sweep logic - orchestrates automated measurements
    sensitivity_sweep_logic:
        module.Class: 'sensitivity_sweep_logic.SensitivitySweepLogic'
        options:
            # Thermal stabilization delay when power changes (seconds)
            thermal_stabilization_time: 180

            # Loop order for parameter sweep
            # Options: 'power', 'f_mod', 'f_dev'
            # Outer loop (first element) changes least frequently
            sweep_loop_order: ['power', 'f_mod', 'f_dev']

            # ODMR fitting parameters
            which_zero_crossing: 2  # Index of zero crossing to use (0-indexed)
            n_most_prominent_peaks: 5
            min_fit_amplitude: 0.005
            min_feature_height: 0.003

            # Off-resonant measurement (optional)
            include_off_resonant_measurement: False
            off_resonant_offset_hz: 30e6  # 30 MHz offset
        connectors:
            odmr_logic: odmr_logic
            time_series_logic: time_series_reader_logic
            streamer: redpitaya_stream          # sets the time-series input to demod
            # tracking_hw: redpitaya_odmr_lock  # tracking comparisons and FIR selection

# ============================================================================
# GUI Modules
# ============================================================================

gui:
    # Sensitivity sweep GUI
    sensitivity_sweep_gui:
        module.Class: 'sensitivity_sweep.sensitivity_sweep_gui.SensitivitySweepGui'
        connectors:
            sensitivity_logic: sensitivity_sweep_logic

    # Optional: Time series GUI for monitoring streaming data
    time_series_gui:
        module.Class: 'time_series.time_series_gui.TimeSeriesGui'
        connectors:
            time_series_logic: time_series_reader_logic

    # Optional: ODMR GUI for manual scans
    odmr_gui:
        module.Class: 'odmr.odmrgui.OdmrGui'
        connectors:
            odmr_logic: odmr_logic
